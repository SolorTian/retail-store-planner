name: Update company visits
run-name: visit-sync-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      year:
        description: Report year
        required: true
        default: '2026'
      request_id:
        description: Request ID generated by planner
        required: true
      public_key:
        description: Browser public encryption key (not a credential)
        required: true
      credential_blob:
        description: Encrypted personal company credential
        required: true
      user_id:
        description: Verified Firebase user ID
        required: true
      dataset:
        description: Data to update
        type: choice
        options:
          - visits
          - customers
          - all
        default: visits
        required: true
permissions:
  contents: write
concurrency:
  group: ttl-visit-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report and encryption dependencies
        run: python -m pip install openpyxl==3.1.5 cryptography==46.0.3
      - name: Export and encrypt visits for requesting browser
        env:
          TTL_CREDENTIAL_PRIVATE_KEY: ${{ secrets.TTL_CREDENTIAL_PRIVATE_KEY }}
          SYNC_CREDENTIAL_BLOB: ${{ inputs.credential_blob }}
          SYNC_USER_ID: ${{ inputs.user_id }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_YEAR: ${{ inputs.year }}
          SYNC_REQUEST_ID: ${{ inputs.request_id }}
          SYNC_PUBLIC_KEY: ${{ inputs.public_key }}
          SYNC_DATASET: ${{ inputs.dataset }}
        run: python scripts/sync_ttl_visits.py